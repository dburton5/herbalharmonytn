backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "blog/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{category}}"
    description: "Saving here publishes on the next Netlify build. Neighbor pitches from /write/ do not show up on their own. For an approved Community Voices piece, start from blog/templates/community-voice.md so the byline includes their name, photo, and Memphis neighborhood."
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Updated Date", name: "updated", widget: "datetime", required: false, hint: "Leave blank if you have not revised the article." }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Herbs A–Z", "Conditions", "Rituals & Rest", "Recipes", "Community Voices"]
      - { label: "Tags", name: "tags", widget: "string", required: false, hint: "Comma-separated. Example: Mullein, Respiratory, Tea" }
      - { label: "Description", name: "description", widget: "text", hint: "Short summary for the card and the top of the article." }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Featured Image Alt Text", name: "thumbnailAlt", widget: "string", required: false, hint: "Describe the photo for someone who cannot see it." }
      - { label: "Featured on the journal home", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Draft (hide from the site)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Voice", name: "voice", widget: "select", options: ["founder", "community"], default: "founder", required: false, hint: "Use community for a neighbor's approved post." }
      - { label: "Author Name", name: "author", widget: "string", default: "Dondre Burton" }
      - { label: "Author Role", name: "authorRole", widget: "string", required: false, default: "Founder, Herbal Harmony TN" }
      - { label: "Memphis Neighborhood", name: "authorNeighborhood", widget: "string", required: false, hint: "Community Voices only. Example: Cooper-Young" }
      - { label: "Author Photo", name: "authorPhoto", widget: "image", required: false }
      - { label: "Author Bio", name: "authorBio", widget: "text", required: false }
      - { label: "Reviewed By", name: "reviewer", widget: "string", required: false, default: "Herbal Harmony Editorial" }
      - { label: "Reviewer Note", name: "reviewerRole", widget: "string", required: false, default: "Checked for plain language and sourcing. Not a clinical review." }
      - label: "Key Takeaways"
        name: "takeaways"
        widget: "list"
        required: false
        hint: "One point per row. Shown in the box at the top of the article."
        field: { label: "Takeaway", name: "takeaway", widget: "string" }
      - label: "Sources"
        name: "sources"
        widget: "list"
        required: false
        hint: "Studies, books, or traditions. The URL can be blank."
        fields:
          - { label: "Source", name: "title", widget: "string" }
          - { label: "URL", name: "url", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # ── SHOP ──────────────────────────────────────────────
  # Each product is saved as /products/<slug>.json. Saving here commits to
  # GitHub, Netlify rebuilds, and the product appears at /shop/<slug>/.
  - name: "products"
    label: "Products"
    label_singular: "Product"
    description: "Products shown on the Shop page. Copy rule: flavor, tradition and ritual language only — no disease or treatment claims."
    folder: "products"
    format: "json"
    extension: "json"
    create: true
    delete: true
    identifier_field: "name"
    slug: "{{fields.slug}}"
    summary: "{{name}} — ${{price}}"
    sortable_fields: ["order", "name", "price"]
    fields:
      - { label: "Product Name", name: "name", widget: "string" }
      - label: "URL Slug"
        name: "slug"
        widget: "string"
        hint: "Lowercase words with dashes, e.g. harmony-herbal-blend. This becomes herbalharmonytn.com/shop/<slug>/ — don't change it after the product is live."
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers and single dashes only"]
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Herbal Tea", "Herbal Syrup", "Herbal Supplement", "Book", "Other"]
        required: false
      - { label: "Price (USD)", name: "price", widget: "number", value_type: "float", min: 0, step: 0.01 }
      - { label: "Size / Container", name: "size", widget: "string", required: false, hint: "e.g. 8 oz clear glass jar with rose-gold lid" }
      - { label: "Net Weight", name: "netWeight", widget: "string", required: false, hint: "As printed on the label, e.g. 2.5 oz (71 g). Leave blank to hide." }
      - { label: "In Stock", name: "inStock", widget: "boolean", default: true, hint: "Turn off to show 'Sold Out' and hide the Buy button." }
      - label: "Buy Link (Stripe Payment Link)"
        name: "buyLink"
        widget: "string"
        required: false
        hint: "Paste the Stripe Payment Link (starts with https://buy.stripe.com/). Leave blank to show 'Available Soon'."
        pattern: ['^https://(buy|checkout)\.stripe\.com/\S+$', "Must be a Stripe Payment Link starting with https://buy.stripe.com/"]
      - { label: "Short Description", name: "shortDescription", widget: "text", hint: "1–2 sentences for the shop card and page top. Flavor, tradition and ritual — no health claims." }
      - { label: "Full Description", name: "description", widget: "markdown", buttons: ["bold", "italic", "link", "bulleted-list"], editor_components: [], hint: "The story of the product. No disease or treatment claims." }
      - label: "Photos"
        name: "photos"
        widget: "list"
        summary: "{{fields.alt}}"
        hint: "First photo is the main/cover image. Square photos look best."
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Alt Text", name: "alt", widget: "string", hint: "Describe the photo for screen readers and Google, e.g. 'Jar of Harmony Herbal Blend beside a mug of tea'." }
      - label: "Ingredients"
        name: "ingredients"
        widget: "list"
        field: { label: "Ingredient", name: "ingredient", widget: "string" }
      - { label: "How to Use / Brewing Directions", name: "directions", widget: "text", required: false }
      - { label: "Good to Know", name: "goodToKnow", widget: "text", required: false, hint: "Cautions and notes, as on the label." }
      - { label: "Storage", name: "storage", widget: "string", required: false, default: "Store cool & dry." }
      - { label: "Show FDA Disclaimer", name: "showDisclaimer", widget: "boolean", default: true, hint: "Shows the standard FDA statement at the bottom of the product page. Keep on if any wellness language is used." }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 10, hint: "Lower numbers show first on the Shop page." }
      - { label: "Published", name: "published", widget: "boolean", default: true, hint: "Turn off to hide the product from the site without deleting it." }

  # ── REVIEWS ───────────────────────────────────────────
  # Customer reviews. Submissions arrive in Netlify (Forms); copy the ones you
  # approve here. Only "Approved" reviews show on the site.
  - name: "reviews"
    label: "Reviews"
    label_singular: "Review"
    description: "Add real customer reviews only. Skip any that claim the tea treats, cures or prevents a condition — those count as health claims on your site."
    folder: "reviews"
    format: "json"
    extension: "json"
    create: true
    delete: true
    identifier_field: "name"
    slug: "{{year}}-{{month}}-{{day}}-{{fields.name}}"
    summary: "{{name}} — {{rating}}★ — {{product}}"
    sortable_fields: ["date", "rating", "name"]
    fields:
      - { label: "Customer Name", name: "name", widget: "string", hint: "First name and last initial is plenty, e.g. Keisha W." }
      - { label: "City", name: "city", widget: "string", required: false, hint: "Optional, e.g. Memphis, TN" }
      - { label: "Product", name: "product", widget: "relation", collection: "products", value_field: "slug", search_fields: ["name"], display_fields: ["name"] }
      - { label: "Rating", name: "rating", widget: "select", options: [{ label: "★★★★★ (5)", value: 5 }, { label: "★★★★ (4)", value: 4 }, { label: "★★★ (3)", value: 3 }, { label: "★★ (2)", value: 2 }, { label: "★ (1)", value: 1 }], default: 5 }
      - { label: "Review", name: "text", widget: "text", hint: "Paste their words. You can trim for length, but don't change what they meant." }
      - { label: "Date", name: "date", widget: "datetime", date_format: "MMM D, YYYY", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Approved (show on site)", name: "approved", widget: "boolean", default: true }

  # ── SHOP SETTINGS ─────────────────────────────────────
  # Store-wide text: pickup & delivery terms and the after-checkout message.
  - name: "settings"
    label: "Shop Settings"
    editor: { preview: false }
    files:
      - name: "shop"
        label: "Pickup, Delivery, Shipping & Thank-You"
        file: "settings/shop.json"
        fields:
          - { label: "Shop Page Banner", name: "fulfillmentBanner", widget: "string", required: false, hint: "One short line shown under the Shop page heading. Leave blank to hide." }
          - { label: "Pickup, Delivery & Shipping Details", name: "fulfillment", widget: "markdown", buttons: ["bold", "italic", "link", "bulleted-list"], editor_components: [], required: false, hint: "Shown on every product page. Never put your home address here — send it by text after purchase." }
          - { label: "Thank-You Page Message", name: "thankYou", widget: "markdown", buttons: ["bold", "italic", "link"], editor_components: [], required: false, hint: "Shown after checkout if your Stripe Payment Link sends customers to herbalharmonytn.com/shop/thank-you/." }
